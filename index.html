<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Zombie Queen — Cocos</title>
<style>
  html,body{margin:0;height:100%;background:#1b1426;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center}
  #g{border:0;display:block;height:100vh;height:100dvh;width:min(100vw,calc(100vh * 9 / 16));width:min(100vw,calc(100dvh * 9 / 16));touch-action:none}
  #rot{display:none}
  @media (orientation:landscape) and (pointer:coarse){
    #g{visibility:hidden}
    #rot{display:flex;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;color:#e9e2f5;font:600 18px/1.5 sans-serif;background:#1b1426}
  }
</style></head><body>
<iframe id="g" allow="autoplay; fullscreen"></iframe>
<div id="rot"><div style="font-size:48px">&#x21BB;</div>휴대폰을 세로로 돌려 주세요</div>
<script>document.getElementById('g').src = 'game.html' + location.search; document.getElementById('g').focus();</script>
</body></html>
